<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>周末计划选择器</title>
  <style>

:root {
  --ink: #111111;
  --paper: #ffffff;
  --muted: #6d6d6d;
  --soft: #f5f5f2;
  --line: #141414;
  --disabled: #c7c7c2;
  --shadow: 4px 5px 0 rgba(0, 0, 0, 0.12);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #ececea;
}

body {
  margin: 0;
  min-height: 100svh;
  color: var(--ink);
  background: #ececea;
  font-family:
    "Comic Sans MS",
    "Kaiti SC",
    "STKaiti",
    "KaiTi",
    "PingFang SC",
    system-ui,
    sans-serif;
  display: flex;
  justify-content: center;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: min(100%, 430px);
  min-height: 100svh;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(rgba(255, 255, 255, 0.975), rgba(255, 255, 255, 0.975)),
    repeating-linear-gradient(
      0deg,
      transparent 0 27px,
      rgba(0, 0, 0, 0.022) 28px
    );
  border-left: 1px solid #deded8;
  border-right: 1px solid #deded8;
}

.screen {
  min-height: 100svh;
  padding:
    calc(18px + env(safe-area-inset-top))
    22px
    calc(24px + env(safe-area-inset-bottom));
  display: none;
  animation: screen-in 180ms ease-out;
}

.screen.active {
  display: flex;
  flex-direction: column;
}

@keyframes screen-in {
  from {
    opacity: 0.35;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.home-center {
  flex: 1;
  display: flex;
  padding: 46px 8px 80px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}

.scribble-logo {
  width: 142px;
  height: 82px;
  display: grid;
  place-items: center;
  border: 4px solid var(--line);
  border-radius: 46% 54% 42% 58% / 50% 44% 56% 50%;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;
  background: var(--paper);
  box-shadow: var(--shadow);
  transform: rotate(-2deg);
  margin-bottom: 44px;
}

.scribble-logo.small {
  width: 100px;
  height: 66px;
}

.home-center h1 {
  font-size: clamp(28px, 8vw, 34px);
  line-height: 1.35;
  margin: 0 0 16px;
  letter-spacing: 1px;
}

.home-center p {
  max-width: 320px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.7;
  margin: 0 0 34px;
}

.home-actions {
  width: 100%;
  max-width: 300px;
  display: flex;
  gap: 16px;
}

.sketch-button,
.next-button {
  border: 3px solid var(--line);
  background: var(--paper);
  border-radius: 48% 52% 45% 55% / 52% 46% 54% 48%;
  min-height: 58px;
  font-weight: 900;
  letter-spacing: 1px;
  box-shadow: var(--shadow);
  transition:
    transform 120ms ease,
    box-shadow 120ms ease,
    background 120ms ease;
}

.sketch-button {
  flex: 1;
  padding: 12px 22px;
}

.sketch-button.primary,
.next-button:not(:disabled) {
  background: var(--ink);
  color: var(--paper);
}

.sketch-button:active,
.next-button:not(:disabled):active {
  transform: translate(3px, 3px);
  box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.13);
}

.sketch-button.wide {
  width: 100%;
  flex: none;
}

.topbar {
  display: grid;
  grid-template-columns: 74px 1fr 74px;
  align-items: center;
  min-height: 46px;
}

.text-button {
  border: 0;
  background: transparent;
  padding: 8px 0;
  font-weight: 800;
}

.back-button {
  text-align: left;
  font-size: 16px;
}

.back-button::before {
  content: "← ";
}

.step-title {
  text-align: center;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 0.8px;
}

.progress-row {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 0 18px;
}

.progress-pill {
  width: 74px;
  height: 48px;
  display: grid;
  place-items: center;
  border: 3px solid var(--line);
  border-radius: 50%;
  font-weight: 900;
  font-size: 13px;
  background: var(--paper);
  transform: rotate(-1deg);
}

.progress-pill.active {
  background: var(--ink);
  color: var(--paper);
}

.progress-line {
  height: 3px;
  flex: 0 0 18px;
  background: var(--line);
  transform: rotate(-3deg);
}

.page-intro {
  margin: 2px 3px 20px;
}

.page-intro.compact {
  margin-bottom: 15px;
}

.page-intro h2 {
  margin: 0 0 5px;
  font-size: 24px;
}

.page-intro p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.option-list {
  display: grid;
  gap: 11px;
}

.option-row {
  width: 100%;
  min-height: 68px;
  display: grid;
  grid-template-columns: 44px 1fr 30px;
  align-items: center;
  gap: 12px;
  padding: 9px 18px;
  border: 3px solid var(--line);
  border-radius: 18px 22px 17px 23px;
  background: var(--paper);
  text-align: left;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.08);
}

.option-row:nth-child(even) {
  transform: rotate(0.35deg);
}

.option-row.selected {
  background: var(--ink);
  color: var(--paper);
}

.option-icon {
  font-size: 23px;
  text-align: center;
}

.option-name {
  font-size: 16px;
  font-weight: 900;
}

.checkmark {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 2px solid currentColor;
  border-radius: 50%;
  font-size: 15px;
  opacity: 0.25;
}

.selected .checkmark {
  opacity: 1;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.place-card,
.food-card {
  position: relative;
  border: 3px solid var(--line);
  background: var(--paper);
  border-radius: 19px 15px 22px 16px;
  text-align: center;
  font-weight: 900;
}

.place-card {
  min-height: 104px;
  padding: 13px 6px 9px;
}

.place-card:nth-child(3n + 2),
.food-card:nth-child(3n + 2) {
  transform: rotate(0.6deg);
}

.place-card.selected,
.food-card.selected {
  background: var(--ink);
  color: var(--paper);
}

.place-card .card-icon {
  display: block;
  font-size: 29px;
  margin-bottom: 8px;
}

.card-check {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 21px;
  height: 21px;
  display: grid;
  place-items: center;
  border: 2px solid currentColor;
  border-radius: 50%;
  font-size: 13px;
  opacity: 0;
}

.selected .card-check {
  opacity: 1;
}

.food-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.food-card {
  min-height: 56px;
  padding: 12px 4px;
  font-size: 14px;
}

.custom-block {
  margin-top: 16px;
}

.custom-block label {
  display: block;
  margin: 0 0 7px 4px;
  font-size: 14px;
  font-weight: 900;
}

.input-shell {
  position: relative;
}

.input-shell input {
  width: 100%;
  height: 62px;
  padding: 0 52px 0 18px;
  border: 3px solid var(--line);
  border-radius: 18px 25px 17px 23px;
  outline: none;
  background: var(--paper);
  font-size: 16px;
  font-weight: 800;
}

.input-shell input:focus {
  box-shadow: var(--shadow);
}

.pencil-mark {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%) rotate(-8deg);
  font-size: 24px;
}

.bottom-area {
  margin-top: auto;
  padding-top: 18px;
}

.selection-hint {
  min-height: 20px;
  margin: 0 0 8px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.next-button {
  width: 100%;
  border-radius: 20px 17px 24px 18px;
  padding: 12px 20px;
}

.next-button:disabled {
  background: var(--disabled);
  color: #71716d;
  border-color: #8f8f8a;
  box-shadow: none;
  cursor: not-allowed;
}

.result-screen {
  position: relative;
}

.result-illustration {
  height: 235px;
  position: relative;
  margin: 0 4px 5px;
  overflow: hidden;
}

.sun {
  position: absolute;
  top: 17px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 50px;
}

.building {
  position: absolute;
  bottom: 18px;
  width: 115px;
  height: 158px;
  border: 4px solid var(--line);
  background:
    linear-gradient(90deg, transparent 43%, var(--line) 44% 47%, transparent 48%),
    repeating-linear-gradient(
      0deg,
      transparent 0 24px,
      var(--line) 25px 28px
    );
}

.building.left {
  left: 24px;
  transform: rotate(-6deg);
  clip-path: polygon(0 21%, 100% 0, 100% 100%, 0 100%);
}

.building.right {
  right: 24px;
  transform: rotate(5deg);
  clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 100%);
}

.road {
  position: absolute;
  left: 50%;
  bottom: -35px;
  width: 110px;
  height: 190px;
  border-left: 4px solid var(--line);
  border-right: 4px solid var(--line);
  transform: translateX(-50%) perspective(120px) rotateX(16deg);
}

.result-title {
  margin: 0 0 18px;
  text-align: center;
  font-size: 25px;
}

.result-group {
  margin-bottom: 15px;
}

.result-label {
  margin: 0 0 7px 4px;
  font-weight: 900;
}

.result-box {
  min-height: 62px;
  padding: 17px 18px;
  border: 3px solid var(--line);
  border-radius: 20px 17px 24px 19px;
  background: var(--paper);
  font-size: 16px;
  font-weight: 900;
  line-height: 1.6;
}

.result-actions {
  margin-top: auto;
  padding-top: 12px;
}

.restart-button {
  width: 100%;
  margin-top: 13px;
  text-align: center;
  color: var(--muted);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: 180ms ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-height: 760px) {
  .screen {
    padding-top: 12px;
  }

  .progress-pill {
    height: 40px;
  }

  .place-card {
    min-height: 88px;
  }

  .place-card .card-icon {
    font-size: 24px;
  }

  .result-illustration {
    height: 175px;
  }
}

@media (min-width: 700px) {
  body {
    padding: 24px 0;
  }

  .app {
    min-height: calc(100svh - 48px);
    border-radius: 28px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.15);
  }

  .screen {
    min-height: calc(100svh - 48px);
  }
}

  </style>
</head>
<body>
  <main class="app" id="app">
    <!-- 首页 -->
    <section class="screen active" data-screen="home">
      <div class="home-center">
        <div class="scribble-logo">PLAN?</div>
        <h1>这周要不要<br />一起出去玩？</h1>
        <p>选时间、选活动、选吃什么，最后生成一份候选计划。</p>

        <div class="home-actions">
          <button class="sketch-button primary" id="yesButton">YES</button>
          <button class="sketch-button" id="noButton">NO</button>
        </div>
      </div>
    </section>

    <!-- 时间 -->
    <section class="screen" data-screen="time">
      <header class="topbar">
        <button class="text-button back-button" data-back="home">back</button>
        <div class="step-title">01 / 03</div>
        <div></div>
      </header>

      <div class="progress-row" aria-label="流程进度">
        <span class="progress-pill active">TIME</span>
        <span class="progress-line"></span>
        <span class="progress-pill">PLACE</span>
        <span class="progress-line"></span>
        <span class="progress-pill">FOOD</span>
      </div>

      <div class="page-intro">
        <h2>什么时候有空？</h2>
        <p>可以多选，之后还能回来修改。</p>
      </div>

      <div class="option-list" id="timeOptions"></div>

      <div class="bottom-area">
        <p class="selection-hint" id="timeHint">至少选择一个时间</p>
        <button class="next-button" id="timeNext" disabled>NEXT</button>
      </div>
    </section>

    <!-- 去哪 -->
    <section class="screen" data-screen="place">
      <header class="topbar">
        <button class="text-button back-button" data-back="time">back</button>
        <div class="step-title">02 / 03</div>
        <div></div>
      </header>

      <div class="progress-row">
        <span class="progress-pill">TIME</span>
        <span class="progress-line"></span>
        <span class="progress-pill active">PLACE</span>
        <span class="progress-line"></span>
        <span class="progress-pill">FOOD</span>
      </div>

      <div class="page-intro compact">
        <h2>想去哪里？</h2>
        <p>点击卡片即可勾选，再点一次可以取消。</p>
      </div>

      <div class="card-grid" id="placeOptions"></div>

      <div class="custom-block">
        <label for="customPlace">还有别的想法？</label>
        <div class="input-shell">
          <input
            id="customPlace"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="例如：东湖骑行"
          />
          <span class="pencil-mark">✎</span>
        </div>
      </div>

      <div class="bottom-area">
        <p class="selection-hint" id="placeHint">至少选择或输入一项</p>
        <button class="next-button" id="placeNext" disabled>NEXT</button>
      </div>
    </section>

    <!-- 吃什么 -->
    <section class="screen" data-screen="food">
      <header class="topbar">
        <button class="text-button back-button" data-back="place">back</button>
        <div class="step-title">03 / 03</div>
        <div></div>
      </header>

      <div class="progress-row">
        <span class="progress-pill">TIME</span>
        <span class="progress-line"></span>
        <span class="progress-pill">PLACE</span>
        <span class="progress-line"></span>
        <span class="progress-pill active">FOOD</span>
      </div>

      <div class="page-intro compact">
        <h2>想吃什么？</h2>
        <p>不用立刻决定餐厅，先选你能接受的类型。</p>
      </div>

      <div class="food-grid" id="foodOptions"></div>

      <div class="custom-block">
        <label for="customFood">没找到想吃的？</label>
        <div class="input-shell">
          <input
            id="customFood"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="例如：泰国菜"
          />
          <span class="pencil-mark">✎</span>
        </div>
      </div>

      <div class="bottom-area">
        <p class="selection-hint" id="foodHint">至少选择或输入一项</p>
        <button class="next-button" id="foodNext" disabled>FINISH</button>
      </div>
    </section>

    <!-- 结果 -->
    <section class="screen result-screen" data-screen="result">
      <header class="topbar">
        <button class="text-button back-button" data-back="food">back</button>
        <div class="step-title">DONE</div>
        <div></div>
      </header>

      <div class="result-illustration" aria-hidden="true">
        <div class="sun">☀</div>
        <div class="building left"></div>
        <div class="building right"></div>
        <div class="road"></div>
      </div>

      <h2 class="result-title">最后结果是</h2>

      <div class="result-group">
        <div class="result-label">我们去</div>
        <div class="result-box" id="resultPlaces"></div>
      </div>

      <div class="result-group">
        <div class="result-label">吃</div>
        <div class="result-box" id="resultFoods"></div>
      </div>

      <div class="result-group">
        <div class="result-label">时间</div>
        <div class="result-box" id="resultTimes"></div>
      </div>

      <div class="result-actions">
        <button class="sketch-button primary wide" id="copyResult">复制结果</button>
        <button class="text-button restart-button" id="restart">重新选择</button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite">已复制</div>
    </section>

    <!-- NO页面 -->
    <section class="screen" data-screen="no">
      <div class="home-center">
        <div class="scribble-logo small">OK</div>
        <h1>那就下次再说。</h1>
        <p>不用现在决定，想出门的时候再回来。</p>
        <button class="sketch-button primary wide" data-back="home">返回首页</button>
      </div>
    </section>
  </main>
  <script>

const timeData = [
  { id: "fri-afternoon", label: "本周五下午", icon: "☁" },
  { id: "fri-evening", label: "本周五晚上", icon: "☾" },
  { id: "sat-afternoon", label: "本周六下午", icon: "☀" },
  { id: "sat-evening", label: "本周六晚上", icon: "✦" },
  { id: "sun-afternoon", label: "本周日下午", icon: "☕" }
];

const placeData = [
  { id: "mall", label: "逛商场", icon: "🛍" },
  { id: "coffee", label: "喝咖啡", icon: "☕" },
  { id: "photo", label: "拍照", icon: "📷" },
  { id: "game", label: "打游戏", icon: "🎮" },
  { id: "boardgame", label: "桌游", icon: "♟" },
  { id: "billiards", label: "台球", icon: "🎱" },
  { id: "exhibition", label: "看展", icon: "▣" },
  { id: "park", label: "逛公园", icon: "♧" },
  { id: "movie", label: "看电影", icon: "🎬" }
];

const foodData = [
  "火锅", "烧烤", "日料",
  "韩餐", "西餐", "泰国菜",
  "川菜", "湘菜", "粤菜",
  "烤肉", "自助餐", "汉堡",
  "甜品", "咖啡", "都可以"
].map((label, index) => ({
  id: `food-${index}`,
  label
}));

const state = {
  screen: "home",
  selectedTimes: new Set(),
  selectedPlaces: new Set(),
  selectedFoods: new Set(),
  customPlace: "",
  customFood: ""
};

const screens = [...document.querySelectorAll(".screen")];

function showScreen(name) {
  state.screen = name;
  screens.forEach((screen) => {
    screen.classList.toggle("active", screen.dataset.screen === name);
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}

function createCheck(text = "✓") {
  const span = document.createElement("span");
  span.className = "checkmark";
  span.textContent = text;
  return span;
}

function renderTimeOptions() {
  const container = document.getElementById("timeOptions");
  container.innerHTML = "";

  timeData.forEach((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option-row";
    button.dataset.id = item.id;

    const icon = document.createElement("span");
    icon.className = "option-icon";
    icon.textContent = item.icon;

    const name = document.createElement("span");
    name.className = "option-name";
    name.textContent = item.label;

    button.append(icon, name, createCheck());

    button.addEventListener("click", () => {
      toggleSet(state.selectedTimes, item.id);
      button.classList.toggle("selected", state.selectedTimes.has(item.id));
      updateValidation();
    });

    container.appendChild(button);
  });
}

function renderPlaceOptions() {
  const container = document.getElementById("placeOptions");
  container.innerHTML = "";

  placeData.forEach((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "place-card";
    button.dataset.id = item.id;

    const check = document.createElement("span");
    check.className = "card-check";
    check.textContent = "✓";

    const icon = document.createElement("span");
    icon.className = "card-icon";
    icon.textContent = item.icon;

    const label = document.createElement("span");
    label.textContent = item.label;

    button.append(check, icon, label);

    button.addEventListener("click", () => {
      toggleSet(state.selectedPlaces, item.id);
      button.classList.toggle("selected", state.selectedPlaces.has(item.id));
      updateValidation();
    });

    container.appendChild(button);
  });
}

function renderFoodOptions() {
  const container = document.getElementById("foodOptions");
  container.innerHTML = "";

  foodData.forEach((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "food-card";
    button.dataset.id = item.id;

    const check = document.createElement("span");
    check.className = "card-check";
    check.textContent = "✓";

    const label = document.createElement("span");
    label.textContent = item.label;

    button.append(check, label);

    button.addEventListener("click", () => {
      // “都可以”与其他选项互斥
      if (item.label === "都可以") {
        state.selectedFoods.clear();
        document
          .querySelectorAll(".food-card.selected")
          .forEach((node) => node.classList.remove("selected"));
      } else {
        const anyItem = foodData.find((food) => food.label === "都可以");
        if (anyItem && state.selectedFoods.has(anyItem.id)) {
          state.selectedFoods.delete(anyItem.id);
          document
            .querySelector(`.food-card[data-id="${anyItem.id}"]`)
            ?.classList.remove("selected");
        }
      }

      toggleSet(state.selectedFoods, item.id);
      button.classList.toggle("selected", state.selectedFoods.has(item.id));
      updateValidation();
    });

    container.appendChild(button);
  });
}

function toggleSet(targetSet, value) {
  if (targetSet.has(value)) {
    targetSet.delete(value);
  } else {
    targetSet.add(value);
  }
}

function updateValidation() {
  const timeNext = document.getElementById("timeNext");
  const placeNext = document.getElementById("placeNext");
  const foodNext = document.getElementById("foodNext");

  timeNext.disabled = state.selectedTimes.size === 0;
  placeNext.disabled =
    state.selectedPlaces.size === 0 && state.customPlace.trim() === "";
  foodNext.disabled =
    state.selectedFoods.size === 0 && state.customFood.trim() === "";

  document.getElementById("timeHint").textContent =
    state.selectedTimes.size > 0
      ? `已选择 ${state.selectedTimes.size} 个时间`
      : "至少选择一个时间";

  const placeCount =
    state.selectedPlaces.size + (state.customPlace.trim() ? 1 : 0);
  document.getElementById("placeHint").textContent =
    placeCount > 0 ? `已选择 ${placeCount} 项` : "至少选择或输入一项";

  const foodCount =
    state.selectedFoods.size + (state.customFood.trim() ? 1 : 0);
  document.getElementById("foodHint").textContent =
    foodCount > 0 ? `已选择 ${foodCount} 项` : "至少选择或输入一项";
}

function selectedLabels(data, selectedSet) {
  return data
    .filter((item) => selectedSet.has(item.id))
    .map((item) => item.label);
}

function renderResult() {
  const times = selectedLabels(timeData, state.selectedTimes);
  const places = selectedLabels(placeData, state.selectedPlaces);
  const foods = selectedLabels(foodData, state.selectedFoods);

  if (state.customPlace.trim()) places.push(state.customPlace.trim());
  if (state.customFood.trim()) foods.push(state.customFood.trim());

  document.getElementById("resultTimes").textContent =
    times.join(" / ") || "暂未确定";
  document.getElementById("resultPlaces").textContent =
    places.join(" / ") || "暂未确定";
  document.getElementById("resultFoods").textContent =
    foods.join(" / ") || "暂未确定";
}

function resultText() {
  return [
    `时间：${document.getElementById("resultTimes").textContent}`,
    `想去：${document.getElementById("resultPlaces").textContent}`,
    `想吃：${document.getElementById("resultFoods").textContent}`
  ].join("
");
}

function resetAll() {
  state.selectedTimes.clear();
  state.selectedPlaces.clear();
  state.selectedFoods.clear();
  state.customPlace = "";
  state.customFood = "";

  document.getElementById("customPlace").value = "";
  document.getElementById("customFood").value = "";

  document
    .querySelectorAll(".selected")
    .forEach((node) => node.classList.remove("selected"));

  updateValidation();
  showScreen("home");
}

document.getElementById("yesButton").addEventListener("click", () => {
  showScreen("time");
});

document.getElementById("noButton").addEventListener("click", () => {
  showScreen("no");
});

document.querySelectorAll("[data-back]").forEach((button) => {
  button.addEventListener("click", () => {
    showScreen(button.dataset.back);
  });
});

document.getElementById("timeNext").addEventListener("click", () => {
  if (state.selectedTimes.size > 0) showScreen("place");
});

document.getElementById("placeNext").addEventListener("click", () => {
  if (state.selectedPlaces.size > 0 || state.customPlace.trim()) {
    showScreen("food");
  }
});

document.getElementById("foodNext").addEventListener("click", () => {
  if (state.selectedFoods.size > 0 || state.customFood.trim()) {
    renderResult();
    showScreen("result");
  }
});

document.getElementById("customPlace").addEventListener("input", (event) => {
  state.customPlace = event.target.value;
  updateValidation();
});

document.getElementById("customFood").addEventListener("input", (event) => {
  state.customFood = event.target.value;
  updateValidation();
});

document.getElementById("copyResult").addEventListener("click", async () => {
  const text = resultText();

  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const temporary = document.createElement("textarea");
    temporary.value = text;
    temporary.style.position = "fixed";
    temporary.style.opacity = "0";
    document.body.appendChild(temporary);
    temporary.select();
    document.execCommand("copy");
    temporary.remove();
  }

  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1400);
});

document.getElementById("restart").addEventListener("click", resetAll);

renderTimeOptions();
renderPlaceOptions();
renderFoodOptions();
updateValidation();

  </script>
</body>
</html>
