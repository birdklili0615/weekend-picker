<script>
const timeOptions = [{"id": "fri_night", "label": "本周五晚上", "rect": [44, 174, 312, 50], "check": [10, 196, 24, 24]}, {"id": "sat_pm", "label": "本周六下午", "rect": [44, 244, 312, 50], "check": [10, 268, 24, 24]}, {"id": "sat_night", "label": "本周六晚上", "rect": [44, 339, 312, 50], "check": [10, 363, 24, 24]}, {"id": "sun_pm", "label": "本周日下午", "rect": [44, 413, 312, 50], "check": [10, 437, 24, 24]}, {"id": "think_more", "label": "再让我想想", "rect": [50, 504, 303, 42], "check": [13, 514, 24, 24]}];
const placeOptions = [{"id": "wushang_tasting", "label": "武商试吃", "rect": [40, 153, 88, 112], "check": [132, 166, 24, 24]}, {"id": "coffee", "label": "咖啡", "rect": [154, 153, 88, 112], "check": [132, 166, 24, 24]}, {"id": "photos", "label": "出片", "rect": [268, 153, 88, 112], "check": [358, 166, 24, 24]}, {"id": "climbing", "label": "攀岩", "rect": [40, 279, 88, 112], "check": [10, 294, 24, 24]}, {"id": "boating", "label": "划船", "rect": [154, 279, 88, 112], "check": [132, 294, 24, 24]}, {"id": "cat_cafe", "label": "撸奶猫", "rect": [268, 279, 88, 112], "check": [358, 294, 24, 24]}, {"id": "mall", "label": "逛商场", "rect": [40, 404, 88, 112], "check": [10, 418, 24, 24]}, {"id": "flower", "label": "采花", "rect": [154, 404, 88, 112], "check": [132, 418, 24, 24]}, {"id": "vintage", "label": "淘古着", "rect": [268, 404, 88, 112], "check": [358, 418, 24, 24]}];
const foodOptions = [{"id": "shibalu", "label": "十八馋", "rect": [44, 148, 82, 57], "check": [128, 160, 24, 24]}, {"id": "cloud_pho", "label": "Cloud PHO", "rect": [153, 148, 82, 57], "check": [128, 160, 24, 24]}, {"id": "yiqi_skewers", "label": "义气羊肉串", "rect": [264, 148, 82, 57], "check": [347, 160, 24, 24]}, {"id": "zhoudi_hotpot", "label": "粥底火锅", "rect": [44, 219, 82, 57], "check": [128, 231, 24, 24]}, {"id": "gonglue_hotpot", "label": "宫略火锅", "rect": [153, 219, 82, 57], "check": [128, 231, 24, 24]}, {"id": "nvrenjie", "label": "女人街串串", "rect": [264, 219, 82, 57], "check": [347, 231, 24, 24]}, {"id": "dingceng_curry", "label": "顶层咖喱", "rect": [44, 289, 82, 57], "check": [128, 302, 24, 24]}, {"id": "bbq_buffet", "label": "烤肉自助", "rect": [153, 289, 82, 57], "check": [128, 302, 24, 24]}, {"id": "fat_brother_dumplings", "label": "胖哥饺子", "rect": [264, 289, 82, 57], "check": [347, 302, 24, 24]}, {"id": "man_sushi", "label": "漫寿司", "rect": [44, 360, 82, 57], "check": [128, 372, 24, 24]}, {"id": "qingxi_pot", "label": "青喜锅", "rect": [153, 360, 82, 57], "check": [128, 372, 24, 24]}, {"id": "jiliu_daren", "label": "鸡柳大人", "rect": [264, 360, 82, 57], "check": [347, 372, 24, 24]}, {"id": "dazhi_small_kitchen", "label": "大志小厨", "rect": [44, 430, 82, 57], "check": [128, 442, 24, 24]}, {"id": "banana_veg", "label": "香蕉菜悦", "rect": [153, 430, 82, 57], "check": [128, 442, 24, 24]}, {"id": "jibenbu", "label": "鸡本部", "rect": [264, 430, 82, 57], "check": [347, 442, 24, 24]}];
const state = { screen:"home", times:new Set(), places:new Set(), foods:new Set(), customPlace:"", customFood:"" };
const screens = {
  home: document.getElementById("screen-home"),
  time: document.getElementById("screen-time"),
  place: document.getElementById("screen-place"),
  food: document.getElementById("screen-food"),
  result: document.getElementById("screen-result"),
};
function showScreen(name) {
  Object.entries(screens).forEach(([k, el]) => el.classList.toggle("active", k===name));
  if (name === "result") renderResult();
  if (name === "home" && typeof resetNoGame === "function") resetNoGame();
  window.scrollTo({top:0, behavior:"instant"});
}
function pxX(v) { return (v/402*100)+"%"; }
function pxY(v) { return (v/874*100)+"%"; }
function pxW(v) { return (v/402*100)+"%"; }
function pxH(v) { return (v/874*100)+"%"; }
function makeTick(x, y) {
  const d = document.createElement("div");
  d.className = "tick";
  d.style.left = pxX(x);
  d.style.top = pxY(y);
  d.innerHTML = '<svg viewBox="0 0 24 24"><path d="M2 13.5 L8.2 20 L22 3.5"></path></svg>';
  return d;
}
function addHotspots(screenSelector, options, selectedSet, checksId, onChange) {
  const frame = document.querySelector(screenSelector + " .frame");
  options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "hotspot";
    b.setAttribute("aria-label", opt.label);
    b.style.left = pxX(opt.rect[0]);
    b.style.top = pxY(opt.rect[1]);
    b.style.width = pxW(opt.rect[2]);
    b.style.height = pxH(opt.rect[3]);
    b.addEventListener("click", () => {
      if (selectedSet.has(opt.id)) selectedSet.delete(opt.id);
      else selectedSet.add(opt.id);
      redrawChecks(checksId, options, selectedSet);
      onChange();
    });
    frame.appendChild(b);
  });
}
function redrawChecks(containerId, options, selectedSet) {
  const c = document.getElementById(containerId);
  c.innerHTML = "";
  options.forEach(opt => {
    if (selectedSet.has(opt.id)) c.appendChild(makeTick(opt.check[0], opt.check[1]));
  });
}
function updateNext() {
  document.getElementById("time-next").classList.toggle("show", state.times.size > 0);
  document.getElementById("place-next").classList.toggle("show", state.places.size > 0 || state.customPlace.trim() !== "");
  document.getElementById("food-next").classList.toggle("show", state.foods.size > 0 || state.customFood.trim() !== "");
}
function selectedLabels(opts, setObj) {
  return opts.filter(o => setObj.has(o.id)).map(o => o.label);
}
function setResultText(id, text) {
  const el = document.getElementById(id);
  el.textContent = text;
  const length = [...text].length;
  if (length <= 12) el.style.fontSize = "16px";
  else if (length <= 18) el.style.fontSize = "14px";
  else if (length <= 25) el.style.fontSize = "12px";
  else el.style.fontSize = "10px";
}
function renderResult() {
  const places = selectedLabels(placeOptions, state.places);
  const foods = selectedLabels(foodOptions, state.foods);
  const times = selectedLabels(timeOptions, state.times);
  if (state.customPlace.trim()) places.push(state.customPlace.trim());
  if (state.customFood.trim()) foods.push(state.customFood.trim());
  setResultText("resultPlaces", places.join("、") || "未选择");
  setResultText("resultFoods", foods.join("、") || "未选择");
  setResultText("resultTimes", times.join("、") || "未选择");
}
function resultText() {
  return [
    "地点：" + document.getElementById("resultPlaces").textContent,
    "吃什么：" + document.getElementById("resultFoods").textContent,
    "时间：" + document.getElementById("resultTimes").textContent
  ].join("\n");
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 1400);
}

const homeNoOriginal = document.getElementById("homeNoOriginal");
const homeNoCover = document.getElementById("homeNoCover");
const homeNoRunner = document.getElementById("homeNoRunner");
const teaseModal = document.getElementById("teaseModal");
const teaseYes = document.getElementById("teaseYes");

let noMoveCount = 0;
let noModalTimer = null;

// 预设多个安全区域，再加入少量随机偏移。
// 避免跑出手机画面，也尽量不遮住主要标题和 YES 按钮。
const noSafePositions = [
  { left: 11, top: 48 },
  { left: 73, top: 43 },
  { left: 16, top: 76 },
  { left: 70, top: 68 },
  { left: 58, top: 52 },
  { left: 7,  top: 61 },
  { left: 77, top: 79 },
  { left: 48, top: 81 }
];

function resetNoGame() {
  noMoveCount = 0;
  clearTimeout(noModalTimer);
  homeNoOriginal.style.display = "block";
  homeNoCover.classList.remove("show");
  homeNoRunner.classList.remove("show");
  teaseModal.classList.remove("show");
  teaseModal.setAttribute("aria-hidden", "true");
}

function nextNoPosition() {
  const usable = noSafePositions.filter((_, index) => index !== nextNoPosition.lastIndex);
  const chosen = usable[Math.floor(Math.random() * usable.length)];
  nextNoPosition.lastIndex = noSafePositions.indexOf(chosen);

  const jitterX = (Math.random() * 4) - 2;
  const jitterY = (Math.random() * 3) - 1.5;
  homeNoRunner.style.left = Math.max(3, Math.min(81, chosen.left + jitterX)) + "%";
  homeNoRunner.style.top = Math.max(9, Math.min(84, chosen.top + jitterY)) + "%";
  homeNoRunner.style.transform = "rotate(" + ((Math.random() * 18) - 9) + "deg)";
}

function openTeaseModal() {
  homeNoRunner.classList.remove("show");
  teaseModal.classList.add("show");
  teaseModal.setAttribute("aria-hidden", "false");
}

function handleNoClick() {
  homeNoOriginal.style.display = "none";
  homeNoCover.classList.add("show");

  noMoveCount += 1;
  nextNoPosition();
  homeNoRunner.classList.add("show");

  // 连续躲开5次；第5次移动后稍停一下，再弹出问题框。
  if (noMoveCount >= 5) {
    clearTimeout(noModalTimer);
    noModalTimer = setTimeout(openTeaseModal, 420);
  }
}

homeNoOriginal.addEventListener("click", handleNoClick);
homeNoRunner.addEventListener("click", handleNoClick);

teaseYes.addEventListener("click", () => {
  teaseModal.classList.remove("show");
  teaseModal.setAttribute("aria-hidden", "true");
  showScreen("time");
});

document.querySelectorAll("[data-go]").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = btn.getAttribute("data-go");
    if (target === "place" && state.times.size === 0) return;
    if (target === "food" && !(state.places.size > 0 || state.customPlace.trim())) return;
    if (target === "result" && !(state.foods.size > 0 || state.customFood.trim())) return;
    showScreen(target);
  });
});
document.querySelectorAll("[data-back]").forEach(btn => btn.addEventListener("click", () => showScreen(btn.getAttribute("data-back"))));
document.getElementById("customPlace").addEventListener("input", e => { state.customPlace = e.target.value; updateNext(); });
document.getElementById("customFood").addEventListener("input", e => { state.customFood = e.target.value; updateNext(); });
document.getElementById("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(resultText());
    showToast("已复制结果");
  } catch {
    showToast("复制失败");
  }
});
addHotspots("#screen-time", timeOptions, state.times, "time-checks", updateNext);
addHotspots("#screen-place", placeOptions, state.places, "place-checks", updateNext);
addHotspots("#screen-food", foodOptions, state.foods, "food-checks", updateNext);
updateNext();
resetNoGame();
</script>
</body>
</html>
